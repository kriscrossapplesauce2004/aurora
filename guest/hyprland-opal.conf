# 400 logical dpi: nearest clean scale to Android's 420 dpi panel density.
monitor = HWC-1, preferred, 0x0, 2.5
monitor = , preferred, auto, 1
debug {
    disable_logs = false
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
cursor {
    no_hardware_cursors = true
}
input {
    follow_mouse = 1
    mouse_refocus = false
    touchdevice {
        enabled = true
        output = HWC-1
        transform = 0
    }
}
decoration {
    rounding = 16
    blur {
        enabled = true
        size = 8
        passes = 3
        ignore_opacity = true
        new_optimizations = true
    }
    shadow {
        enabled = false
    }
}
layerrule = blur, ^opal-(bar|shelf|overlay|toast)$
layerrule = ignorealpha 0.1, ^opal-(bar|shelf|overlay|toast)$
layerrule = noanim, ^opal-(bar|shelf|overlay|toast)$
layerrule = blur, ^opal-(audio|shade)$
layerrule = ignorealpha 0.1, ^opal-(audio|shade)$
layerrule = noanim, ^opal-(audio|shade)$
layerrule = noanim, ^opal-(audio|shade)-dismiss$
animations {
    enabled = true
    bezier = auroraArrive, 0.16, 1, 0.3, 1
    bezier = auroraLeave, 0.4, 0, 1, 1
    animation = windowsIn, 1, 3.2, auroraArrive, popin 94%
    animation = windowsOut, 1, 1.8, auroraLeave, popin 98%
    animation = windowsMove, 1, 3, auroraArrive
    animation = workspaces, 1, 3.2, auroraArrive, slidefade 12%
    animation = layers, 1, 2, auroraArrive, fade
    animation = fade, 1, 1.8, auroraArrive
    animation = border, 1, 2, auroraArrive
}
xwayland {
    force_zero_scaling = false
}
exec-once = /usr/local/bin/aurora-opal start
bind = SUPER, Return, exec, foot /bin/bash
bind = SUPER, K, exec, /usr/local/bin/aurora-osk toggle
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, E, exec, touch /mnt/aurora-control/exit
bind = SUPER, F, fullscreen, 0
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
